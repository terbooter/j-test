services:

  postgres:
    container_name: jtn-postgres
    image: postgres:17
    ports:
      - 5432:5432
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASS}
      PGDATA: /var/lib/postgresql/data
    volumes:
      - jtnpgdata:/var/lib/postgresql/data

volumes:
  jtnpgdata: